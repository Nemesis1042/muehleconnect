name: Linux/macOS-Installer bauen

# Baut den Linux-AppImage (und, wo möglich, den macOS-DMG) für einen schnellen Ad-hoc-Testbuild,
# analog zu build-windows-installer.yml. Native Module müssen für die jeweilige Plattform
# kompiliert werden, deshalb läuft jeder Build auf einem echten Runner der Ziel-Plattform statt per
# Cross-Build. Für offizielle, getaggte Releases mit allen Plattformen siehe stattdessen
# release.yml.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "kassensystem/**"
      - ".github/workflows/build-linux-mac-installer.yml"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kassensystem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kassensystem/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: kassensystem-linux-appimage
          path: kassensystem/dist/*.AppImage
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kassensystem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kassensystem/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        # Ohne gültiges Apple-Entwickler-Zertifikat (das dieses Projekt nicht hat) würde
        # electron-builder sonst versuchen, eine lokale Signierungs-Identität zu suchen, und daran
        # scheitern/hängen bleiben - das Ergebnis ist ein unsigniertes DMG, für den internen
        # Gebrauch ausreichend (macOS zeigt beim ersten Start eine "unbekannter Entwickler"-Warnung).
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: kassensystem-macos-dmg
          path: kassensystem/dist/*.dmg
          if-no-files-found: error
