name: Release veröffentlichen

# Baut Windows-Installer und Linux-AppImage und hängt beide als Downloads an ein GitHub-Release.
# Läuft automatisch, sobald ein Tag im Format v* gepusht wird (z.B. v1.0.0) - siehe README,
# Abschnitt "Release veröffentlichen" für den genauen Ablauf zum Anlegen eines solchen Tags.
# workflow_dispatch baut testweise beide Installer, veröffentlicht aber kein Release (dafür fehlt
# ohne Tag der Versionsstand) - praktisch, um den Workflow selbst zu prüfen.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kassensystem
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kassensystem/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: kassensystem/dist/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kassensystem
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kassensystem/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: kassensystem/dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: GitHub-Release erstellen und Installer anhängen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/*.exe
            artifacts/linux-appimage/*.AppImage
          generate_release_notes: true
